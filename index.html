<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where I'm Applying</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f1;--land:#cfd9d6;--land-on:#aebfba;--line:#eef2f1;--grat:#dde4e2;
  --ink:#15222a;--muted:#51626a;--rule:#cdd7d5;--panel:#ffffff;--panel-ink:#15222a;
  --accent:#006b54;--accent-state:#006b54;--leader:#15222a;--label-bg:rgba(255,255,255,.88);
  --row:rgba(0,107,84,.11);--sign:#006b54;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181b;--land:#2b363b;--land-on:#3e4d53;--line:#11181b;--grat:#1b2428;
    --ink:#e9eff1;--muted:#9db0b8;--rule:#2b363b;--panel:#1b2428;--panel-ink:#e9eff1;
    --accent:#45c7a0;--accent-state:#0f8a6c;--leader:#e9eff1;--label-bg:rgba(17,24,27,.84);
    --row:rgba(69,199,160,.13);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181b;--land:#2b363b;--land-on:#3e4d53;--line:#11181b;--grat:#1b2428;
  --ink:#e9eff1;--muted:#9db0b8;--rule:#2b363b;--panel:#1b2428;--panel-ink:#e9eff1;
  --accent:#45c7a0;--accent-state:#0f8a6c;--leader:#e9eff1;--label-bg:rgba(17,24,27,.84);
  --row:rgba(69,199,160,.13);color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
.cond{font-family:"Barlow Semi Condensed","Arial Narrow",Barlow,"Helvetica Neue",Arial,sans-serif}
.page{max-width:1360px;margin:0 auto;padding-block:clamp(18px,3vw,34px) 26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;margin-bottom:clamp(10px,2vw,18px)}
.sign{margin:0;display:inline-block;background:var(--sign);color:#fff;border-radius:13px;padding:5px;box-shadow:0 1px 3px rgba(10,20,25,.35)}
.sign>span{display:block;border:2px solid #fff;border-radius:9px;padding:8px 20px 9px;font-weight:600;font-size:clamp(27px,3.5vw,40px);line-height:1.05}
.sign small{display:block;font-weight:500;font-size:.52em;line-height:1.2;margin-top:3px}
.lede{flex:1 1 320px;max-width:60ch;margin:0;color:var(--muted)}
.lede b{color:var(--ink);font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(20px,2.4vw,34px);align-items:start}
.stage{position:relative;width:100%;aspect-ratio:1000/640}
.base,.leaders{position:absolute;inset:0;width:100%;height:100%;display:block}
.leaders{pointer-events:none}
.grat{fill:none;stroke:var(--grat);stroke-width:1}
.land{fill:var(--land)}
.st{fill:var(--land-on);transition:fill .15s ease}
.st.on{fill:var(--accent-state)}
.borders{fill:none;stroke:var(--line);stroke-width:1;stroke-linejoin:round}
.leaders line{stroke:var(--leader);stroke-opacity:.6;stroke-width:1.25}
.leaders circle{fill:var(--leader);fill-opacity:.8}
.leaders .on line,.leaders line.on{stroke:var(--accent);stroke-opacity:1;stroke-width:2}
.leaders circle.on{fill:var(--accent);fill-opacity:1}
.badge{position:absolute;width:var(--b,56px);height:var(--b,56px);padding:0;border:0;background:none;color:inherit;font:inherit;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:2;touch-action:manipulation}
.badge.on{z-index:5}
.face{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(21,34,42,.16),0 2px 6px rgba(21,34,42,.3);transition:transform .16s ease,box-shadow .16s ease}
.face img{display:block;width:var(--s,68%);height:var(--s,68%);object-fit:contain}
.badge:hover .face,.badge.on .face{transform:scale(1.16);box-shadow:0 0 0 2.5px var(--accent),0 6px 14px rgba(21,34,42,.36)}
.badge:focus{outline:none}
.badge:focus-visible .face{outline:3px solid var(--accent);outline-offset:3px}
.tag{display:none;position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);white-space:nowrap;font-weight:600;font-size:12.5px;line-height:1;padding:2px 5px 3px;border-radius:4px;background:var(--label-bg);color:var(--ink);pointer-events:none}
.labels .tag{display:block}
@media (prefers-reduced-motion:no-preference){
  .play .face{animation:pop .6s cubic-bezier(.2,1.55,.4,1) backwards;animation-delay:calc(var(--i)*130ms + 250ms)}
  .play .tag{animation:fade .3s ease backwards;animation-delay:calc(var(--i)*130ms + 560ms)}
  .card{animation:rise .17s ease-out}
}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(6px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.row:focus-visible,.x:focus-visible,.card a:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.side h2{margin:0 0 6px;font-weight:600;font-size:20px;line-height:1.2}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:6px 8px;border:0;border-bottom:1px solid var(--rule);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
.row:hover,.row.on{background:var(--row)}
.dot{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(21,34,42,.16)}
.dot img{display:block;width:var(--s,68%);height:var(--s,68%);object-fit:contain}
.nm{display:block;font-weight:600;line-height:1.15}
.ct{display:block;color:var(--muted);font-size:14px;line-height:1.2}
.card{position:absolute;width:300px;z-index:10;background:var(--panel);color:var(--panel-ink);border-radius:14px;overflow:hidden;box-shadow:0 12px 32px rgba(10,20,25,.34),0 0 0 1px rgba(10,20,25,.12)}
.card[hidden]{display:none}
.card:focus{outline:none}
.lg{display:grid;place-items:center;height:112px;background:#fff;padding:12px 44px;border-bottom:1px solid rgba(21,34,42,.1)}
.lg img{display:block;max-width:100%;max-height:88px;object-fit:contain}
.bd{padding:11px 16px 14px}
.bd h3{margin:0;font-weight:600;font-size:22px;line-height:1.12}
.sch{margin:2px 0 9px;color:var(--muted);font-size:15px;line-height:1.25}
.bd dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0 0 10px;font-size:15px;line-height:1.25}
.bd dt{color:var(--muted)}
.bd dd{margin:0;font-weight:500}
.card a{color:var(--accent);font-weight:600;text-underline-offset:2px}
.x{position:absolute;top:6px;right:6px;width:36px;height:36px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:rgba(21,34,42,.08);color:#15222a;font:400 21px/1 Barlow,Arial,sans-serif;cursor:pointer}
.x:hover{background:rgba(21,34,42,.16)}
@media (max-width:980px){
  main{grid-template-columns:minmax(0,1fr)}
  .card{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:auto;max-width:460px;margin-inline:auto}
  .lg{height:92px}.lg img{max-height:70px}
}
</style>
</head>

var VW=1000,VH=640;
var stage=document.getElementById('stage'),leaders=document.getElementById('leaders'),host=document.getElementById('badges'),list=document.getElementById('list'),card=document.getElementById('card');

U.forEach(function(u,i){

  var b=document.createElement('button');

function bind(el,id){
  el.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse'&&!pinned)open(id,false)});
  el.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'&&!pinned)later()});
  el.addEventListener('focus',function(){if(kbd&&!pinned)open(id,false)});
  el.addEventListener('blur',function(){if(kbd&&!pinned)later()});
  el.addEventListener('click',function(){
    if(pinned&&active===id){close();return}
    open(id,true);
    if(kbd)card.focus();
  });
}
card.addEventListener('pointerenter',function(){clearTimeout(timer)});
card.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'&&!pinned)later()});
function later(){clearTimeout(timer);timer=setTimeout(close,170)}

function mark(id,on){
  var u=byId[id];if(!u)return;
  u.badge.classList.toggle('on',on);u.row.classList.toggle('on',on);
  var st=document.getElementById('s'+u.fips);if(st)st.classList.toggle('on',on);
  if(u.ln)u.ln.classList.toggle('on',on);
  if(u.pt)u.pt.classList.toggle('on',on);
}
function open(id,pin){
  clearTimeout(timer);
  pinned=!!pin;
  if(active===id&&!card.hidden){place(byId[id]);return}
  if(active)mark(active,false);
  active=id;mark(id,true);
  var u=byId[id];
  card.innerHTML='<button class="x" type="button" aria-label="Close">&times;</button>'+
    '<div class="lg"><img alt="'+u.uni+' logo" src="'+u.full+'"></div>'+
    '<div class="bd"><h3 class="cond">'+u.uni+'</h3><p class="sch">'+u.school+'</p>'+
    '<dl><dt>Program</dt><dd>'+u.program+'</dd><dt>Location</dt><dd>'+u.city+'</dd><dt>Deadline</dt><dd>'+u.dl+(u.note?' ('+u.note+')':'')+'</dd><dt>QS 2027</dt><dd>'+u.qs+'</dd></dl>'+
    '<a href="'+u.url+'" target="_blank" rel="noopener noreferrer">Program page</a></div>';
  card.querySelector('.x').addEventListener('click',function(){var b=byId[id].badge;close();if(kbd)b.focus()});
  card.hidden=false;
  card.style.animation='none';void card.offsetWidth;card.style.animation='';

}
function close(){
  clearTimeout(timer);
  if(active)mark(active,false);
  active=null;pinned=false;card.hidden=true;
}
function place(u){
  if(sheet.matches){card.style.left='';card.style.top='';return}
  var W=stage.clientWidth,H=stage.clientHeight,cw=card.offsetWidth,ch=card.offsetHeight,g=18,r=size/2,x=u.px,y=u.py,left;
  if(x+r+g+cw<=W-4)left=x+r+g;
  else if(x-r-g-cw>=4)left=x-r-g-cw;
  else left=W-x>x?W-cw-4:4;
  var top=Math.max(4,Math.min(y-ch/2,H-ch-4));
  card.style.left=left+'px';card.style.top=top+'px';
}

window.addEventListener('keydown',function(e){
  if(e.key==='Tab')kbd=true;
  if(e.key==='Enter'||e.key===' ')kbd=true;
  if(e.key==='Escape'&&active){var b=byId[active].badge;close();b.focus()}
},true);
window.addEventListener('pointerdown',function(e){
  kbd=false;
  if(active&&!(e.target.closest&&e.target.closest('.card,.badge,.row')))close();
},true);

function layout(){
  var W=stage.clientWidth,H=stage.clientHeight;if(!W)return;
  var labels=W>=640;

    var u=p.u;u.px=p.x;u.py=p.y;
    u.badge.style.left=p.x+'px';u.badge.style.top=p.y+'px';
    var ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',p.ax);ln.setAttribute('y1',p.ay);ln.setAttribute('x2',p.x);ln.setAttribute('y2',p.y);
    leaders.appendChild(ln);u.ln=ln;
  });
  n.forEach(function(p){
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',p.ax);c.setAttribute('cy',p.ay);c.setAttribute('r',W>=640?3:2.2);
    leaders.appendChild(c);p.u.pt=c;
  });
  if(active){mark(active,true);place(byId[active])}
}
layout();
if(window.ResizeObserver)new ResizeObserver(function(){requestAnimationFrame(layout)}).observe(stage);
else window.addEventListener('resize',layout);

})();
</script>
